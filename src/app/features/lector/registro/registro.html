<div class="register-page" style="min-height: 100vh;">
  <div class="register-box">
    <div class="card card-outline card-primary shadow">
      <div class="card-header text-center pt-4 pb-3">
        <img src="burrito-lector.jpg"
             alt="Burrito Lector IPN"
             width="96"
             height="96"
             class="img-circle elevation-2 mb-2"
             style="width: 96px; height: 96px; object-fit: cover; border: 3px solid #6C1D45;">
        <div>
          <a routerLink="/burritolector/login" class="h2 text-dark">
            <b style="color: #6C1D45;">Burrito</b> Lector
          </a>
        </div>
        <span class="badge mt-1" style="background-color: #6C1D45; color: #fff; font-weight: 500;">
          Instituto Politécnico Nacional
        </span>
      </div>

      <div class="card-body">
        <p class="login-box-msg">Registrar una nueva cuenta de lector</p>

        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          <div class="input-group mb-3">
            <input type="text"
                   class="form-control"
                   placeholder="Nombre completo"
                   formControlName="fullName">
            <div class="input-group-append">
              <div class="input-group-text">
                <span class="fas fa-user" style="color: #6C1D45;"></span>
              </div>
            </div>
          </div>

          <div class="input-group mb-3">
            <input type="email"
                   class="form-control"
                   placeholder="Correo electrónico"
                   formControlName="email">
            <div class="input-group-append">
              <div class="input-group-text">
                <span class="fas fa-envelope" style="color: #6C1D45;"></span>
              </div>
            </div>
          </div>

          <div class="input-group mb-3">
            <input type="password"
                   class="form-control"
                   placeholder="Contraseña (mínimo 4 caracteres)"
                   formControlName="password">
            <div class="input-group-append">
              <div class="input-group-text">
                <span class="fas fa-lock" style="color: #6C1D45;"></span>
              </div>
            </div>
          </div>

          <div class="input-group mb-3">
            <input type="password"
                   class="form-control"
                   [class.is-invalid]="passwordsNoCoinciden"
                   placeholder="Confirmar contraseña"
                   formControlName="confirmPassword">
            <div class="input-group-append">
              <div class="input-group-text">
                <span class="fas fa-check-double" style="color: #6C1D45;"></span>
              </div>
            </div>
          </div>

          @if (passwordsNoCoinciden) {
            <div class="alert alert-warning py-2 text-center small mb-3">
              <i class="fas fa-exclamation-circle mr-1"></i> Las contraseñas no coinciden
            </div>
          }

          @if (errorMsg()) {
            <div class="alert alert-danger py-2 text-center small mb-3">
              <i class="fas fa-exclamation-triangle mr-1"></i> {{ errorMsg() }}
            </div>
          }

          <div class="row">
            <div class="col-12">
              <button type="submit"
                      class="btn btn-primary btn-block font-weight-bold"
                      [disabled]="form.invalid">
                Registrarse
              </button>
            </div>
          </div>
        </form>

        <p class="mt-3 mb-1 text-center">
          <a routerLink="/burritolector/login" class="text-center">
            Ya tengo una cuenta, iniciar sesión
          </a>
        </p>
      </div>
    </div>
  </div>
</div>
