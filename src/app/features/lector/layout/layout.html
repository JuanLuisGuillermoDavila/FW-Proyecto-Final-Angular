<div class="wrapper layout-fixed">

  <!-- Barra superior -->
  <nav class="main-header navbar navbar-expand navbar-white navbar-light border-bottom">
    <!-- Enlaces izquierdos -->
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" data-widget="pushmenu" href="javascript:void(0)" role="button">
          <i class="fas fa-bars" style="color: #6C1D45;"></i>
        </a>
      </li>
      <li class="nav-item d-none d-sm-inline-block">
        <a routerLink="/burritolector/galeria" class="nav-link font-weight-medium">Inicio</a>
      </li>
    </ul>

    <!-- Enlaces derechos: Avatar + Nombre + Salir -->
    <ul class="navbar-nav ml-auto align-items-center">

      <!-- Avatar + Nombre -->
      <li class="nav-item d-flex align-items-center mr-3">
        <img src="burrito-usuario.jpg"
             class="img-circle elevation-1 mr-2"
             alt="Usuario Lector"
             style="width: 32px; height: 32px; object-fit: cover; border: 2px solid #6C1D45;">
        <span class="text-dark font-weight-bold small">
          {{ auth.currentUser()?.fullname || 'Lector' }}
        </span>
      </li>

      <li class="nav-item">
        <a href="javascript:void(0)"
           (click)="auth.logout(false)"
           class="nav-link d-flex align-items-center text-danger font-weight-medium"
           role="button">
          <i class="fas fa-sign-out-alt mr-1"></i>
          <span>Salir</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Menú lateral -->
  <aside class="main-sidebar sidebar-dark-primary elevation-4 sidebar-ipn">
    <!-- Brand Logo -->
    <a routerLink="/burritolector/galeria" class="brand-link border-bottom border-secondary">
      <img src="burrito-lector.jpg"
           alt="Burrito Lector Logo"
           class="brand-image img-circle elevation-3"
           style="opacity: .9; object-fit: cover;">
      <span class="brand-text font-weight-light"><b>Burrito</b> Lector</span>
    </a>

    <!-- Sidebar -->
    <div class="sidebar">
      <nav class="mt-2">
        <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu" data-accordion="false">

          <li class="nav-item">
            <a routerLink="/burritolector/galeria" routerLinkActive="active" class="nav-link">
              <i class="nav-icon fas fa-book-open"></i>
              <p>Galería</p>
            </a>
          </li>

          <li class="nav-item">
            <a routerLink="/burritolector/afinidad" routerLinkActive="active" class="nav-link">
              <i class="nav-icon fas fa-heart"></i>
              <p>Afinidad</p>
            </a>
          </li>

          <li class="nav-header">SESIÓN</li>

          <li class="nav-item">
            <a href="javascript:void(0)" (click)="auth.logout(false)" class="nav-link" role="button">
              <i class="nav-icon fas fa-sign-out-alt text-warning"></i>
              <p>Salir</p>
            </a>
          </li>

        </ul>
      </nav>
    </div>
  </aside>

  <!-- Contenedor principal -->
  <div class="content-wrapper bg-light">
    <section class="content pt-4">
      <div class="container-fluid">
        <router-outlet></router-outlet>
      </div>
    </section>
  </div>

</div>
