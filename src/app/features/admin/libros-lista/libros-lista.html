<div class="card card-outline card-primary shadow-sm">
  

<div class="card-body">
  <h3 class="card-title font-weight-bold mb-0">
    <i class="fas fa-book mr-2" style="color: #6C1D45;"></i>
    Libros
  </h3>
  <div class="text-right mb-3">
      <a routerLink="/burritoadministrador/libros/agregar" class="btn btn-primary btn-sm px-3">Agregar</a>
    </div>
  <div class="table-responsive">
  <table class="table table-bordered table-striped table-hover align-middle mb-0">
    <thead class="table-light">
      <tr>
        <th>Titulo</th>
        <th>Autor</th>
        <th style="width: 210px;">Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for (libro of libros(); track libro.id) {
        <tr>
          <td>{{ libro.titulo }}</td>
          <td>{{ libro.autor }}</td>
          <td>
            <div class="d-flex gap-2">
              <a [routerLink]="['/burritoadministrador/libros/editar', libro.id]" class="btn btn-primary btn-sm px-3">Editar</a>
              <a [routerLink]="['/burritoadministrador/libros/eliminar', libro.id]" class="btn btn-danger btn-sm px-3">Eliminar</a>
            </div>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="3" class="text-center text-muted py-3">No hay libros registrados.</td>
        </tr>
      }
    </tbody>
  </table>
  </div>
</div>
</div>
