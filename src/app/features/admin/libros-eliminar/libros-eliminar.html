<div class="card card-outline card-primary shadow-sm">
  <div class="card-body">
    <h3 class="h4 font-weight-bold mb-4">
      <i class="fas fa-book mr-2" style="color: #6C1D45;"></i>
      Libros/eliminar
    </h3>

    @if (libro(); as item) {
      <div class="row">
        <!-- Columna Izquierda -->
        <div class="col-md-6">
          <div class="form-group">
            <input type="text" class="form-control bg-light" [value]="item.titulo" readonly>
          </div>
          <div class="form-group">
            <input type="text" class="form-control bg-light" [value]="item.editorial" readonly>
          </div>
          <div class="form-group">
            <textarea class="form-control bg-light" rows="7" readonly>{{ item.sinopsis }}</textarea>
          </div>
        </div>

        <!-- Columna Derecha -->
        <div class="col-md-6">
          <div class="form-group">
            <input type="text" class="form-control bg-light" [value]="item.autor" readonly>
          </div>
          <div class="form-group">
            <input type="text" class="form-control bg-light" [value]="item.genero" readonly>
          </div>

          @if (item.imagen) {
            <div class="form-group">
              <img [src]="item.imagen" [alt]="item.titulo" class="img-thumbnail" style="max-height: 150px;">
            </div>
          }
        </div>
      </div>

      <div class="mt-3">
        <button type="button" class="btn btn-danger px-4 mr-2" (click)="confirmarEliminacion()">Eliminar</button>
        <a routerLink="/burritoadministrador/libros" class="btn btn-secondary px-4">Cancelar</a>
      </div>
    }
  </div>
</div>
