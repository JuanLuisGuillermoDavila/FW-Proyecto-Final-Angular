<!-- layout-admin.html -->
<div class="d-flex flex-column min-vh-100">
  <!-- Barra superior -->
  <header class="d-flex border-bottom border-dark bg-white">
    <div class="border-end border-dark p-3 text-center fw-bold fs-4" style="width: 220px;">
      Burrito Lector
    </div>
    <div class="flex-grow-1 d-flex justify-content-end align-items-center px-4">
      <span class="fw-medium">{{ auth.currentUser()?.fullname || 'Lector' }}</span>
    </div>
  </header>

  <!-- Cuerpo: Menú lateral + Contenido -->
  <div class="d-flex flex-grow-1">
    <aside class="border-end border-dark bg-white" style="width: 220px;">
      <div class="list-group list-group-flush border-bottom border-dark">
        <a routerLink="/burritoadministrador/dash" routerLinkActive="fw-bold bg-light"
           class="list-group-item list-group-item-action border-0 py-3">Dash</a>
        <a routerLink="/burritoadministrador/libros" routerLinkActive="fw-bold bg-light"
           class="list-group-item list-group-item-action border-0 py-3">Libros</a>
      </div>
      <div class="border-bottom border-dark">
        <button (click)="auth.logout(true)" class="btn btn-link text-dark text-decoration-none w-100 text-start px-3 py-3">
          Salir
        </button>
      </div>
    </aside>

    <main class="flex-grow-1 p-4 bg-white">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
