<div class="card card-outline card-primary shadow-sm">
  <div class="card-body">
    <h3 class="h4 font-weight-bold mb-4">
      <i class="fas fa-book mr-2" style="color: #6C1D45;"></i>
      {{ libroId() ? 'Libros/editar' : 'Libros/agregar' }}
    </h3>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="row">
        <!-- Columna Izquierda -->
        <div class="col-md-6">
          <div class="form-group">
            <input type="text" class="form-control" placeholder="Título" formControlName="titulo">
          </div>
          <div class="form-group">
            <input type="text" class="form-control" placeholder="Editorial" formControlName="editorial">
          </div>
          <div class="form-group">
            <textarea class="form-control" rows="7" placeholder="Sinopsis" formControlName="sinopsis"></textarea>
          </div>
        </div>

        <!-- Columna Derecha -->
        <div class="col-md-6">
          <div class="form-group">
            <input type="text" class="form-control" placeholder="Autor" formControlName="autor">
          </div>
          <div class="form-group">
            <input type="text" class="form-control" placeholder="Género" formControlName="genero">
          </div>

          @if (vistaPrevia()) {
            <div class="form-group">
              <img [src]="vistaPrevia()" alt="Portada" class="img-thumbnail" style="max-height: 150px;">
            </div>
          }

          <div class="input-group mb-3">
            <input type="text" class="form-control bg-white" [value]="nombreArchivo()" placeholder="Seleccionar archivo..." readonly>
            <div class="input-group-append">
              <label class="btn btn-outline-secondary mb-0">
                Elegir imagen
                <input type="file" accept="image/*" (change)="onFileChange($event)" hidden>
              </label>
            </div>
          </div>
        </div>
      </div>

      <div class="mt-3">
        <button type="submit" class="btn btn-success px-4 mr-2" [disabled]="form.invalid">
          {{ libroId() ? 'Editar' : 'Agregar' }}
        </button>
        <a routerLink="/burritoadministrador/libros" class="btn btn-secondary px-4">Cancelar</a>
      </div>
    </form>
  </div>
</div>
