<!-- dash.html -->
<div class="card card-outline card-primary shadow-sm">
<div class="card-body">

    <h3 class="h4 font-weight-bold mb-4">
      <i class="fas fa-chart-line mr-2" style="color: #6C1D45;"></i>
      DASH
    </h3>
  <div class="row text-center mt-2">
    <div class="col-md-4">
      <div class="card card-outline card-secondary h-100">
        <div class="card-header">
          <h3 class="card-title font-weight-bold mt-1">Lectores</h3>
        </div>
        <div class="card-body">
          <div class="display-4 font-weight-normal">{{ stats().lectores }}</div>
        </div>
      </div>
  </div>

  <div class="col-md-4">
    <div class="card card-outline card-secondary h-100">
      <div class="card-header">
        <h3 class="card-title font-weight-bold mt-1">Libros</h3>
      </div>
      <div class="card-body">
        <div class="display-4 font-weight-normal">{{ stats().libros }}</div>
      </div>
    </div>
  </div>

  <div class="col-md-4">
    <div class="card card-outline card-secondary h-100">
      <div class="card-header">
        <h3 class="card-title font-weight-bold mt-1">Promedio de rating</h3>
      </div>
      <div class="card-body">
          <div class="display-4 font-weight-normal">{{ stats().promedioRating }}</div>
        </div>
      </div>
    </div>
  </div>
</div>
</div>
