@if (serverStatus.estado() === 'despertando') {
  <div class="alert alert-warning rounded-0 mb-0 py-2 px-4 d-flex align-items-center justify-content-center gap-3 shadow-sm border-bottom" role="alert">
    <div class="spinner-border spinner-border-sm text-dark" role="status"></div>
    <span>
      <strong>El servidor en Render estaba dormido</strong> y se está activando. Esto puede tardar entre 30 y 50 segundos, por favor espera...
    </span>
  </div>
}

@if (serverStatus.estado() === 'activo') {
  <div class="alert alert-success rounded-0 mb-0 py-2 px-4 d-flex align-items-center justify-content-center gap-2 shadow-sm border-bottom" role="alert">
    <i class="bi bi-check-circle-fill"></i>
    <span>
      <strong>¡Servidor activo!</strong> Ya puedes iniciar sesión, registrarte o navegar con normalidad.
    </span>
  </div>
}

<router-outlet></router-outlet>
